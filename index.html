<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="format-detection" content="telephone=no">
  <title>チル・ハルキング 〜ホテルの怪〜</title>
  <link rel="stylesheet" href="assets/css/game.css">
</head>
<body oncontextmenu="return false;">

  <!-- Game Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- Stamina Bar -->
  <div id="staminaBar">
    <div id="staminaFill"></div>
  </div>

  <!-- Title Screen Overlay -->
  <div id="titleScreen" class="overlay">
    <div class="title-content">
      <h1 class="game-title">チル・ハルキング</h1>
      <p class="game-subtitle">〜ホテルの怪〜</p>
      <div class="title-decoration"></div>
      <button id="startBtn" class="start-btn" type="button">タップしてスタート</button>
    </div>
    <p class="copyright">CHILL HARUKING &copy; 2026</p>
  </div>

  <!-- Loading Screen Overlay -->
  <div id="loadingScreen" class="overlay" style="display:none;">
    <div class="loading-content">
      <p class="loading-text" id="loadingText">読み込み中...</p>
      <div class="loading-bar">
        <div class="loading-fill" id="loadingFill"></div>
      </div>
      <p class="loading-hint" id="loadingHint">ホテルへようこそ</p>
    </div>
  </div>

  <!-- Dialogue Box Overlay -->
  <div id="dialogueBox" style="display:none;">
    <div class="dialogue-inner">
      <span class="speaker-name" id="speakerName"></span>
      <p class="dialogue-text" id="dialogueText"></p>
      <span class="dialogue-next">▼</span>
    </div>
  </div>

  <!-- Phone Call UI Overlay -->
  <div id="phoneUI" class="overlay" style="display:none;">
    <div class="phone-content">
      <div class="phone-icon">
        <div class="phone-receiver"></div>
      </div>
      <p class="phone-caller">着信</p>
      <p class="phone-name">ハルキ</p>
      <button id="answerBtn" class="answer-btn" type="button">
        <span class="answer-icon"></span>
        応答する
      </button>
    </div>
  </div>

  <!-- Game Over Screen Overlay -->
  <div id="gameOverScreen" class="overlay" style="display:none;">
    <div class="gameover-content">
      <h1 class="gameover-text">ゲームオーバー</h1>
      <p class="gameover-sub">あなたは逃げられなかった...</p>
      <button id="retryBtn" class="retry-btn" type="button">リトライ</button>
    </div>
  </div>

  <!-- Ending / Clear Screen Overlay -->
  <div id="endingScreen" class="overlay" style="display:none;">
    <div class="ending-content">
      <p class="ending-escape">脱出成功</p>
      <h1 class="ending-title">ENDING</h1>
      <p class="ending-message">あなたはホテルから逃げ出した。<br>しかし、ハルキの影は今も...<br></p>
      <p class="ending-thanks">プレイしていただき<br>ありがとうございました</p>
      <button id="titleReturnBtn" class="retry-btn" type="button">タイトルへ戻る</button>
    </div>
  </div>

  <!-- Virtual Joystick -->
  <div id="joystickArea" style="display:none;">
    <div class="joystick-outer">
      <div class="joystick-inner" id="joystickThumb"></div>
    </div>
  </div>

  <!-- Action Button -->
  <button id="actionBtn" type="button" style="display:none;">
    <span id="actionBtnText">調べる</span>
  </button>

  <!-- Scripts -->
  <script src="assets/js/engine.js"></script>
  <script src="assets/js/game.js"></script>

</body>
</html>
