<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="追跡者 -HARUKI- | 一人称モバイルホラーゲーム。深夜のホテルで追跡者ハルキから逃げ延びろ。">
  <meta property="og:title" content="追跡者 -HARUKI-">
  <meta property="og:description" content="一人称モバイルホラーゲーム。深夜のホテルで追跡者ハルキから逃げ延びろ。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://harukiman.github.io/chill_haruking/">
  <meta property="og:site_name" content="追跡者 -HARUKI-">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="追跡者 -HARUKI-">
  <meta name="twitter:description" content="一人称モバイルホラーゲーム。深夜のホテルで追跡者ハルキから逃げ延びろ。">
  <title>追跡者 -HARUKI-</title>
  <link rel="stylesheet" href="assets/css/game.css">
</head>
<body oncontextmenu="return false;">

  <!-- Game Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- Stamina Bar -->
  <div id="staminaBar">
    <div id="staminaFill"></div>
  </div>

  <!-- Title Screen Overlay -->
  <div id="titleScreen" class="overlay">
    <canvas id="lightningCanvas"></canvas>
    <div class="title-content">
      <h1 class="game-title">追跡者</h1>
      <p class="game-subtitle">-HARUKI-</p>
      <div class="title-decoration"></div>
      <button id="startBtn" class="start-btn" type="button">タップしてスタート</button>
    </div>
    <p class="copyright">TSUISEKISHA -HARUKI- &copy; 2026</p>
  </div>

  <!-- Loading Screen Overlay -->
  <div id="loadingScreen" class="overlay" style="display:none;">
    <div class="loading-content">
      <p class="loading-text" id="loadingText">読み込み中...</p>
      <div class="loading-bar">
        <div class="loading-fill" id="loadingFill"></div>
      </div>
      <p class="loading-hint" id="loadingHint">ホテルへようこそ</p>
    </div>
  </div>

  <!-- Dialogue Box Overlay -->
  <div id="dialogueBox" style="display:none;">
    <div class="dialogue-inner">
      <span class="speaker-name" id="speakerName"></span>
      <p class="dialogue-text" id="dialogueText"></p>
      <span class="dialogue-next">▼</span>
    </div>
  </div>

  <!-- Phone Call UI Overlay -->
  <div id="phoneUI" class="overlay" style="display:none;">
    <div class="phone-content">
      <div class="phone-icon">
        <div class="phone-receiver"></div>
      </div>
      <p class="phone-caller">着信</p>
      <p class="phone-name">ハルキ</p>
      <button id="answerBtn" class="answer-btn" type="button">
        <span class="answer-icon"></span>
        応答する
      </button>
    </div>
  </div>

  <!-- Game Over Screen Overlay -->
  <div id="gameOverScreen" class="overlay" style="display:none;">
    <div class="gameover-content">
      <h1 class="gameover-text">ゲームオーバー</h1>
      <p class="gameover-sub">あなたは逃げられなかった...</p>
      <button id="retryBtn" class="retry-btn" type="button">リトライ</button>
    </div>
  </div>

  <!-- Ending / Clear Screen Overlay -->
  <div id="endingScreen" class="overlay" style="display:none;">
    <div class="ending-content">
      <p class="ending-escape">脱出成功</p>
      <h1 class="ending-title">ENDING</h1>
      <p class="ending-message">あなたはホテルから逃げ出した。<br>しかし、ハルキの影は今も...<br></p>
      <p class="ending-thanks">プレイしていただき<br>ありがとうございました</p>
      <button id="titleReturnBtn" class="retry-btn" type="button">タイトルへ戻る</button>
    </div>
  </div>

  <!-- Left Joystick (movement) -->
  <div id="joystickArea" class="virtual-stick" style="display:none;">
    <div class="joystick-outer">
      <div class="joystick-inner" id="joystickThumb"></div>
    </div>
  </div>

  <!-- Right Joystick (camera) -->
  <div id="lookArea" class="virtual-stick" style="display:none;">
    <div class="joystick-outer">
      <div class="joystick-inner" id="lookThumb"></div>
    </div>
  </div>

  <!-- Touch zones (invisible, capture touches to spawn joysticks) -->
  <div id="touchZoneLeft" style="display:none;"></div>
  <div id="touchZoneRight" style="display:none;"></div>

  <!-- Action Button -->
  <button id="actionBtn" type="button" style="display:none;">
    <span id="actionBtnText">調べる</span>
  </button>

  <!-- Minimap Button -->
  <button id="minimapBtn" type="button" aria-label="マップ">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5">
      <rect x="1" y="1" width="16" height="16" rx="2"/>
      <line x1="7" y1="1" x2="7" y2="17"/>
      <line x1="11" y1="1" x2="11" y2="17"/>
      <line x1="1" y1="9" x2="17" y2="9"/>
    </svg>
  </button>

  <!-- Expanded Minimap Overlay -->
  <div id="minimapOverlay" class="overlay" style="display:none;">
    <div class="minimap-expanded">
      <canvas id="minimapCanvas"></canvas>
      <div class="minimap-legend">
        <span class="legend-player">■</span> 現在地
        <span class="legend-objective">■</span> 目的地
      </div>
      <button id="closeMinimapBtn" type="button" class="minimap-close">閉じる</button>
    </div>
  </div>

  <!-- Settings Button -->
  <button id="settingsBtn" type="button" class="settings-btn" aria-label="設定">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
      <circle cx="10" cy="10" r="3"/>
      <path d="M10 1v2M10 17v2M1 10h2M17 10h2M3.5 3.5l1.4 1.4M15.1 15.1l1.4 1.4M3.5 16.5l1.4-1.4M15.1 4.9l1.4-1.4"/>
    </svg>
  </button>

  <!-- Settings Overlay -->
  <div id="settingsOverlay" class="overlay" style="display:none;">
    <div class="settings-panel">
      <h2 class="settings-title">設定</h2>
      <div class="settings-item">
        <label for="volumeSlider">マスター音量</label>
        <div class="slider-row">
          <input type="range" id="volumeSlider" min="0" max="100" value="70" class="volume-slider">
          <span id="volumeValue" class="volume-value">70%</span>
        </div>
      </div>
      <div class="settings-item">
        <label for="bgmSlider">BGM / 環境音</label>
        <div class="slider-row">
          <input type="range" id="bgmSlider" min="0" max="100" value="70" class="volume-slider">
          <span id="bgmValue" class="volume-value">70%</span>
        </div>
      </div>
      <div class="settings-item">
        <label for="seSlider">効果音</label>
        <div class="slider-row">
          <input type="range" id="seSlider" min="0" max="100" value="80" class="volume-slider">
          <span id="seValue" class="volume-value">80%</span>
        </div>
      </div>
      <div class="settings-buttons">
        <button id="returnTitleFromSettings" type="button" class="settings-action-btn">タイトルに戻る</button>
        <button id="closeSettingsBtn" type="button" class="settings-close-btn">閉じる</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="assets/js/engine.js"></script>
  <script src="assets/js/game.js"></script>

</body>
</html>
